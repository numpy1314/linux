[package]
name = "axvisor-linux-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "../check-core-baseline.rs"

[lib]
crate-type = ["rlib"]

[features]
default = []
control = ["axvisor_api/control"]
# Local compatibility marker; the shared x86 Core has no such Cargo feature.
arm-vhe = []
shell = ["axvisor_api/shell"]

[dependencies]
axvisor_api = { git = "https://github.com/numpy1314/tgoskits", rev = "ce800d4d28fd552441f166c2679f63f8b14d121c", default-features = false }
ax-errno = { git = "https://github.com/numpy1314/tgoskits", rev = "ce800d4d28fd552441f166c2679f63f8b14d121c" }
spin = "0.12"
