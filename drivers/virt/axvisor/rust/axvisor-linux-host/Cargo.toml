[package]
name = "axvisor-linux-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
control = ["axvisor_api/control"]
arm-vhe = ["axvisor_api/arm-vhe"]
shell = ["axvisor_api/shell"]

[dependencies]
axvisor_api = { git = "https://github.com/numpy1314/tgoskits", rev = "8ff79f83f90d2baed2906f5a821b92418c144dce", default-features = false }
ax-errno = { git = "https://github.com/numpy1314/tgoskits", rev = "8ff79f83f90d2baed2906f5a821b92418c144dce" }
spin = "0.12"
