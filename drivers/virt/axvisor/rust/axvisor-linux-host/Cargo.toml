[package]
name = "axvisor-linux-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "../check-core-baseline.rs"

[lib]
crate-type = ["rlib"]

[features]
default = []
control = ["axvisor_api/control"]
# Local compatibility marker; the shared x86 Core has no such Cargo feature.
arm-vhe = []
shell = ["axvisor_api/shell"]

[dependencies]
axvisor_api = { git = "https://github.com/Ivans-11/tgoskits", rev = "4152c3e780feb5e44241fb3fa143fe04bdca0181", default-features = false }
ax-errno = { git = "https://github.com/Ivans-11/tgoskits", rev = "4152c3e780feb5e44241fb3fa143fe04bdca0181" }
spin = "0.12"
