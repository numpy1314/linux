[package]
name = "axvisor-linux-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "../check-core-baseline.rs"

[lib]
crate-type = ["staticlib"]

[features]
default = []
control = ["axvisor_api/control", "axvisor_core/control"]
ept-level-4 = ["axvisor_core/ept-level-4"]
# Linux-owned VHE boundary; the unchanged shared Core detects VHE at runtime.
arm-vhe = []
shell = ["axvisor_api/shell", "axvisor_core/shell"]
sstc = ["axvisor_core/sstc"]
svm = ["axvisor_core/svm"]
vmx = ["axvisor_core/vmx"]
conformance-test = ["dep:axvisor-linux-conformance"]

[dependencies]
axvisor_core = { git = "https://github.com/Ivans-11/tgoskits", rev = "4152c3e780feb5e44241fb3fa143fe04bdca0181", default-features = false }
axvisor_api = { git = "https://github.com/Ivans-11/tgoskits", rev = "4152c3e780feb5e44241fb3fa143fe04bdca0181", default-features = false }
axvisor-linux-conformance = { path = "../axvisor-linux-conformance", optional = true }
ax-percpu = { git = "https://github.com/Ivans-11/tgoskits", rev = "4152c3e780feb5e44241fb3fa143fe04bdca0181", features = ["custom-base", "external-base"] }
log = "0.4"
